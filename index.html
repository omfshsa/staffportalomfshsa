<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>OMFS HSA Staff Portal</title>
  <meta name="description" content="Centralized hub for OMFS HSA department applications.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="preconnect" href="https://cdnjs.cloudflare.com">

  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#1e3c72" id="theme-color-meta">

  <meta name="apple-mobile-web-app-title" content="OMFS HSA">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512.png">

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    /* CSS Variables for Light/Dark Mode */
    :root {
      --bg-color: #f4f7f6;
      --text-color: #2c3e50;
      --card-bg: #ffffff;
      --card-shadow: rgba(0,0,0,0.05);
      --card-shadow-hover: rgba(0,0,0,0.1);
      --header-bg: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
      --desc-color: #6c757d;
      --border-color: transparent;
      --input-bg: #ffffff;
      --input-border: #ced4da;
    }

    [data-theme="dark"] {
      --bg-color: #121212;
      --text-color: #e0e0e0;
      --card-bg: #1e1e1e;
      --card-shadow: rgba(0,0,0,0.3);
      --card-shadow-hover: rgba(0,0,0,0.5);
      --header-bg: linear-gradient(135deg, #0d1b33 0%, #162b50 100%);
      --desc-color: #a0aab2;
      --border-color: #333;
      --input-bg: #2b2b2b;
      --input-border: #444;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    .portal-header {
      background: var(--header-bg);
      color: white;
      padding: 3rem 1rem 2rem 1rem;
      border-bottom-left-radius: 20px;
      border-bottom-right-radius: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      margin-bottom: 2rem;
      position: relative;
    }

    .header-controls {
      position: absolute;
      top: 15px;
      right: 15px;
      display: flex;
      gap: 10px;
    }

    .btn-icon {
      background: rgba(255, 255, 255, 0.2);
      border: none;
      color: white;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.3s;
    }

    .btn-icon:hover {
      background: rgba(255, 255, 255, 0.4);
    }

    .hospital-logo {
      font-size: 2.5rem;
      margin-bottom: 10px;
    }

    .portal-header h1 {
      font-weight: 700;
      letter-spacing: 1px;
    }

    .search-container {
      max-width: 500px;
      margin: 1.5rem auto 0 auto;
    }

    .app-card {
      background: var(--card-bg);
      border-radius: 15px;
      border: 1px solid var(--border-color);
      padding: 1.5rem;
      transition: all 0.3s ease;
      box-shadow: 0 4px 6px var(--card-shadow);
      height: 100%;
      min-height: 220px;
      text-align: center;
      text-decoration: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--text-color);
      position: relative;
      -webkit-tap-highlight-color: transparent;
    }

    .app-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 20px var(--card-shadow-hover);
      text-decoration: none;
      color: var(--text-color);
    }

    .app-card:focus-visible {
      outline: 3px solid #0d6efd;
      outline-offset: 4px;
    }

    .status-badge {
      position: absolute;
      top: 15px;
      right: 15px;
      font-size: 0.7rem;
    }

    .delete-btn {
      position: absolute;
      top: 15px;
      left: 15px;
      font-size: 0.9rem;
      color: #dc3545;
      background: transparent;
      border: none;
      cursor: pointer;
      display: none;
      z-index: 10;
    }

    .app-card:hover .delete-btn {
      display: block;
    }

    .app-icon {
      font-size: 2.5rem;
      margin-bottom: 1rem;
      width: 80px;
      height: 80px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      transition: all 0.3s ease;
    }

    .app-title {
      font-weight: 600;
      font-size: 1.1rem;
      margin-bottom: 0.5rem;
    }

    .app-desc {
      font-size: 0.85rem;
      color: var(--desc-color);
    }

    /* Theme Colors */
    .theme-blue .app-icon { color: #0d6efd; background: rgba(13, 110, 253, 0.1); }
    .theme-blue:hover .app-icon, .theme-blue:focus-visible .app-icon { background: #0d6efd; color: white; }
    .theme-blue:hover .app-title, .theme-blue:focus-visible .app-title { color: #0d6efd; }

    .theme-orange .app-icon { color: #fd7e14; background: rgba(253, 126, 20, 0.1); }
    .theme-orange:hover .app-icon, .theme-orange:focus-visible .app-icon { background: #fd7e14; color: white; }
    .theme-orange:hover .app-title, .theme-orange:focus-visible .app-title { color: #fd7e14; }

    .theme-green .app-icon { color: #198754; background: rgba(25, 135, 84, 0.1); }
    .theme-green:hover .app-icon, .theme-green:focus-visible .app-icon { background: #198754; color: white; }
    .theme-green:hover .app-title, .theme-green:focus-visible .app-title { color: #198754; }

    .theme-purple .app-icon { color: #6f42c1; background: rgba(111, 66, 193, 0.1); }
    .theme-purple:hover .app-icon, .theme-purple:focus-visible .app-icon { background: #6f42c1; color: white; }
    .theme-purple:hover .app-title, .theme-purple:focus-visible .app-title { color: #6f42c1; }

    .theme-red .app-icon { color: #dc3545; background: rgba(220, 53, 69, 0.1); }
    .theme-red:hover .app-icon, .theme-red:focus-visible .app-icon { background: #dc3545; color: white; }
    .theme-red:hover .app-title, .theme-red:focus-visible .app-title { color: #dc3545; }

    .theme-teal .app-icon { color: #20c997; background: rgba(32, 201, 151, 0.1); }
    .theme-teal:hover .app-icon, .theme-teal:focus-visible .app-icon { background: #20c997; color: white; }
    .theme-teal:hover .app-title, .theme-teal:focus-visible .app-title { color: #20c997; }

    .app-card.disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }
    .app-card.disabled:hover {
      transform: none;
      box-shadow: 0 4px 6px var(--card-shadow);
    }
    
    .footer-note {
      font-size: 0.8rem;
      color: var(--desc-color);
      text-align: center;
      margin-top: 2rem;
    }

    /* Modal Dark Mode fixes */
    [data-theme="dark"] .modal-content {
      background-color: var(--card-bg);
      color: var(--text-color);
      border: 1px solid var(--border-color);
    }
    [data-theme="dark"] .modal-header, 
    [data-theme="dark"] .modal-footer {
      border-color: var(--border-color);
    }
    [data-theme="dark"] .form-control,
    [data-theme="dark"] .form-select {
      background-color: var(--input-bg);
      color: var(--text-color);
      border-color: var(--input-border);
    }
    [data-theme="dark"] .form-control::placeholder {
      color: #888;
    }
    [data-theme="dark"] .btn-close {
      filter: invert(1) grayscale(100%) brightness(200%);
    }

    #ios-prompt {
      display: none;
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--card-bg);
      color: var(--text-color);
      padding: 15px 20px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
      z-index: 1000;
      width: 90%;
      max-width: 400px;
      text-align: center;
      border: 1px solid var(--border-color);
    }

    @media (max-width: 575.98px) {
      .portal-header { padding: 3rem 1rem 1.5rem 1rem; }
      .portal-header h1 { font-size: 1.65rem; }
      .portal-header .lead { font-size: 0.95rem; }
      .app-card { padding: 1rem; min-height: 195px; }
      .app-icon { width: 68px; height: 68px; font-size: 2rem; }
      .app-title { font-size: 0.98rem; }
      .app-desc { font-size: 0.78rem; }
      .delete-btn { display: block; opacity: 0.5; } /* Always show on mobile for discoverability */
    }
  </style>
</head>

<body>
  <header class="portal-header text-center">
    <div class="header-controls">
      <button id="installBtn" class="btn-icon" style="display: none;" aria-label="Install App" title="Install App">
        <i class="fa-solid fa-download"></i>
      </button>
      <button id="addAppBtn" class="btn-icon" aria-label="Add Application" title="Add Application" data-bs-toggle="modal" data-bs-target="#addAppModal">
        <i class="fa-solid fa-plus"></i>
      </button>
      <button id="themeToggle" class="btn-icon" aria-label="Toggle Dark Mode" title="Toggle Dark Mode">
        <i class="fa-solid fa-moon"></i>
      </button>
    </div>

    <div class="container">
      <div class="hospital-logo"><i class="fa-solid fa-staff-snake"></i></div>
      <h1>OMFS HSA Staff Portal</h1>
      <p class="lead">Centralized hub for all department applications</p>
      
      <div class="search-container">
        <div class="input-group">
          <span class="input-group-text bg-white border-0"><i class="fa-solid fa-magnifying-glass text-muted"></i></span>
          <input type="text" id="searchInput" class="form-control border-0" placeholder="Search applications..." aria-label="Search applications">
        </div>
      </div>
    </div>
  </header>

  <main class="container mb-5">
    <div class="row g-4" id="appGrid">
      </div>

    <div class="footer-note">
      Stay connected. Accessible anywhere, anytime.
    </div>
  </main>

  <div class="modal fade" id="addAppModal" tabindex="-1" aria-labelledby="addAppModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="addAppModalLabel">Add New Application</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <form id="addAppForm">
            <div class="mb-3">
              <label for="appTitle" class="form-label">Application Name *</label>
              <input type="text" class="form-control" id="appTitle" required placeholder="e.g., Leave System">
            </div>
            <div class="mb-3">
              <label for="appUrl" class="form-label">URL / Link *</label>
              <input type="url" class="form-control" id="appUrl" required placeholder="https://...">
            </div>
            <div class="mb-3">
              <label for="appDesc" class="form-label">Description</label>
              <input type="text" class="form-control" id="appDesc" placeholder="Brief description of the app">
            </div>
            <div class="mb-3">
              <label for="appIcon" class="form-label">Icon (FontAwesome Class)</label>
              <input type="text" class="form-control" id="appIcon" placeholder="e.g., fa-solid fa-link" value="fa-solid fa-link">
              <div class="form-text">Find icons at <a href="https://fontawesome.com/search?o=r&m=free" target="_blank">FontAwesome</a></div>
            </div>
            <div class="mb-3">
              <label for="appTheme" class="form-label">Color Theme</label>
              <select class="form-select" id="appTheme">
                <option value="theme-blue">Blue</option>
                <option value="theme-orange">Orange</option>
                <option value="theme-green">Green</option>
                <option value="theme-purple">Purple</option>
                <option value="theme-red">Red</option>
                <option value="theme-teal">Teal</option>
              </select>
            </div>
            <div class="mb-3">
              <label for="appStatus" class="form-label">Status</label>
              <select class="form-select" id="appStatus">
                <option value="Online">Online</option>
                <option value="Coming Soon">Coming Soon</option>
              </select>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-primary" id="saveAppBtn">Save Application</button>
        </div>
      </div>
    </div>
  </div>

  <div id="ios-prompt">
    <p class="mb-2 text-start fs-6">Install this portal on your iPhone:</p>
    <p class="mb-0 text-start small text-muted">Tap the Share icon <i class="fa-solid fa-arrow-up-from-bracket mx-1"></i> and select <strong>"Add to Home Screen"</strong>.</p>
    <button class="btn btn-sm btn-outline-secondary w-100 mt-3" onclick="document.getElementById('ios-prompt').style.display='none'">Dismiss</button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    // --- 1. Default Data & LocalStorage Logic ---
    const defaultApps = [
      { id: "1", title: "GA List System", url: "https://slot-charmer.lovable.app", icon: "fa-solid fa-calendar-check", theme: "theme-blue", desc: "Book OT slot, create GA List", status: "Online" },
      { id: "2", title: "Stor Unit", url: "https://script.google.com/macros/s/AKfycbxz1hD3nGFAsnMXPTFSc3tKK2MCigqs2qPaBXu2MFg4qZA-baCdM4zDILJ3fFHMdIwb/exec", icon: "fa-solid fa-user-doctor", theme: "theme-orange", desc: "Track ins outs, track spending", status: "Online" },
      { id: "3", title: "Staff Planner", url: "https://staff-shine-94.lovable.app", icon: "fa-solid fa-clipboard-list", theme: "theme-green", desc: "Cuti rehat, off, EL, MC, kursus, meeting", status: "Online" },
      { id: "4", title: "Biopsy Registry", url: "#", icon: "fa-solid fa-file-invoice-dollar", theme: "theme-purple", desc: "Record biopsy and HPE diagnosis", status: "Coming Soon" },
      { id: "5", title: "KPI Jabatan", url: "#", icon: "fa-solid fa-book-medical", theme: "theme-red", desc: "Link to KPI OMFS", status: "Coming Soon" },
      { id: "6", title: "Inventory", url: "#", icon: "fa-solid fa-boxes-stacked", theme: "theme-teal", desc: "Order dental & surgical supplies", status: "Coming Soon" }
    ];

    let myApps = [];

    function loadApps() {
      const stored = localStorage.getItem('omfs-apps');
      if (stored) {
        myApps = JSON.parse(stored);
      } else {
        myApps = [...defaultApps];
        saveApps();
      }
      renderApps();
    }

    function saveApps() {
      localStorage.setItem('omfs-apps', JSON.stringify(myApps));
    }

    // --- 2. Dynamic Rendering ---
    function renderApps(filterTerm = '') {
      const grid = document.getElementById('appGrid');
      grid.innerHTML = ''; 

      const filteredApps = myApps.filter(app => 
        app.title.toLowerCase().includes(filterTerm.toLowerCase()) || 
        app.desc.toLowerCase().includes(filterTerm.toLowerCase())
      );

      filteredApps.forEach(app => {
        const isDisabled = app.status === 'Coming Soon';
        const disabledClass = isDisabled ? 'disabled' : '';
        const badgeClass = isDisabled ? 'bg-secondary' : 'bg-success';
        const clickHandler = isDisabled ? `onclick="event.preventDefault(); alert('${app.title} is currently in development.');"` : '';
        const targetAttr = (!isDisabled && app.url !== '#') ? 'target="_blank" rel="noopener"' : '';

        const html = `
          <div class="col-6 col-md-4 col-lg-3 app-item" data-title="${app.title}">
            <a href="${app.url}" ${targetAttr} class="app-card ${app.theme} ${disabledClass}" aria-label="Open ${app.title}" ${clickHandler}>
              <button class="delete-btn" onclick="deleteApp(event, '${app.id}')" title="Remove App">
                <i class="fa-solid fa-trash-can"></i>
              </button>
              <span class="badge ${badgeClass} status-badge">${app.status}</span>
              <div class="app-icon"><i class="${app.icon}"></i></div>
              <div class="app-title">${app.title}</div>
              <div class="app-desc">${app.desc}</div>
            </a>
          </div>
        `;
        grid.insertAdjacentHTML('beforeend', html);
      });
    }

    // --- 3. Add & Delete Functionality ---
    document.getElementById('saveAppBtn').addEventListener('click', () => {
      const form = document.getElementById('addAppForm');
      if (!form.checkValidity()) {
        form.reportValidity();
        return;
      }

      const newApp = {
        id: Date.now().toString(),
        title: document.getElementById('appTitle').value,
        url: document.getElementById('appUrl').value,
        desc: document.getElementById('appDesc').value || 'User added application',
        icon: document.getElementById('appIcon').value || 'fa-solid fa-link',
        theme: document.getElementById('appTheme').value,
        status: document.getElementById('appStatus').value
      };

      myApps.push(newApp);
      saveApps();
      renderApps(document.getElementById('searchInput').value);
      
      form.reset();
      const modalElement = document.getElementById('addAppModal');
      const modalInstance = bootstrap.Modal.getInstance(modalElement);
      modalInstance.hide();
    });

    function deleteApp(event, id) {
      event.preventDefault(); // Prevent opening the link
      event.stopPropagation();
      
      if (confirm('Are you sure you want to remove this application?')) {
        myApps = myApps.filter(app => app.id !== id);
        saveApps();
        renderApps(document.getElementById('searchInput').value);
      }
    }

    // --- 4. Dark Mode Toggle ---
    const themeToggle = document.getElementById('themeToggle');
    const htmlEl = document.documentElement;
    const themeIcon = themeToggle.querySelector('i');
    const metaThemeColor = document.getElementById('theme-color-meta');

    const savedTheme = localStorage.getItem('omfs-theme') || 'light';
    setTheme(savedTheme);

    themeToggle.addEventListener('click', () => {
      const currentTheme = htmlEl.getAttribute('data-theme');
      const newTheme = currentTheme === 'light' ? 'dark' : 'light';
      setTheme(newTheme);
    });

    function setTheme(theme) {
      htmlEl.setAttribute('data-theme', theme);
      localStorage.setItem('omfs-theme', theme);
      if (theme === 'dark') {
        themeIcon.classList.replace('fa-moon', 'fa-sun');
        metaThemeColor.setAttribute('content', '#0d1b33');
      } else {
        themeIcon.classList.replace('fa-sun', 'fa-moon');
        metaThemeColor.setAttribute('content', '#1e3c72');
      }
    }

    // --- 5. Search/Filter Functionality ---
    const searchInput = document.getElementById('searchInput');
    searchInput.addEventListener('input', (e) => {
      renderApps(e.target.value);
    });

    // --- 6. PWA Install Logic ---
    let deferredPrompt;
    const installBtn = document.getElementById('installBtn');

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      installBtn.style.display = 'flex';
    });

    installBtn.addEventListener('click', async () => {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        if (outcome === 'accepted') {
          installBtn.style.display = 'none';
        }
        deferredPrompt = null;
      }
    });

    // --- 7. iOS Detection and Prompt ---
    const isIos = () => /iphone|ipad|ipod/.test(window.navigator.userAgent.toLowerCase());
    const isInStandaloneMode = () => ('standalone' in window.navigator) && (window.navigator.standalone);

    if (isIos() && !isInStandaloneMode()) {
      setTimeout(() => {
        document.getElementById('ios-prompt').style.display = 'block';
      }, 2000);
    }

    // --- 8. Service Worker Registration ---
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('./sw.js').catch(function (error) {
          console.log('Service worker registration failed:', error);
        });
      });
    }

    // Initialize Application
    loadApps();

  </script>
</body>
</html>
